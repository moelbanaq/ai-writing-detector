name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engineering:
    name: Engineering Track A Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: npm ci

      - name: Check runtime version
        run: npm run check:runtime

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Run Track A engineering tests
        run: npm run test:engineering

      - name: Build applications and packages
        run: npm run build
